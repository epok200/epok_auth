name: Import trusted foundation branch

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: epok-auth-foundation-import
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.repository == 'epok200/epok_auth' &&
      github.event.pull_request.head.repo.full_name == 'epok200/epok_auth' &&
      github.event.pull_request.head.ref == 'codex/auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout the explicitly trusted branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: epok200/epok_auth
          ref: codex/auth-foundation
          fetch-depth: 0

      - name: Verify and extract the locally validated tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .bootstrap ]; then
            echo "Validated tree already imported."
            exit 0
          fi

          test -f .bootstrap/archive.part000
          test -f .bootstrap/archive.part001
          test "$(find .bootstrap -maxdepth 1 -name 'archive.part*' | wc -l)" -eq 2

          cat .bootstrap/archive.part* | tr -d '\n' | base64 --decode > /tmp/epok-auth.tar.gz
          echo "a9493db0544d9932e158634c50d7b247c6fbee3e98050feb189f829bac9b5521  /tmp/epok-auth.tar.gz" | sha256sum -c -

          tar -tzf /tmp/epok-auth.tar.gz > /tmp/archive-files.txt
          test -s /tmp/archive-files.txt
          if grep -Eq '(^|/)\.git(/|$)|^\.github/' /tmp/archive-files.txt; then
            echo "Archive contains forbidden repository metadata or workflows."
            exit 1
          fi

          tar -xzf /tmp/epok-auth.tar.gz -C .
          rm -rf .bootstrap

      - name: Commit the imported tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "epok-auth foundation importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Validated tree already imported."
            exit 0
          fi
          git commit -m "feat: import validated authentication foundation [bootstrap-complete]"
          git push origin HEAD:codex/auth-foundation
