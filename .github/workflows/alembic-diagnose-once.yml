name: Diagnose Alembic state once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://epok_auth:epok_auth@127.0.0.1:5432/epok_auth_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: epok_auth
          POSTGRES_PASSWORD: epok_auth
          POSTGRES_DB: epok_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U epok_auth -d epok_auth_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/auth-foundation
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev --python 3.12
      - name: Upgrade and inspect revision tables
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import os
          from psycopg import connect
          from epok_auth.migrate import upgrade_database

          url = os.environ["TEST_DATABASE_URL"]
          upgrade_database(url)
          sync_url = url.replace("postgresql+psycopg://", "postgresql://", 1)
          with connect(sync_url, autocommit=True) as connection:
              print("current_schema:", connection.execute("SELECT current_schema()").fetchone())
              print("schemas:", connection.execute("SELECT current_schemas(true)").fetchone())
              print(
                  "revision tables:",
                  connection.execute(
                      "SELECT schemaname, tablename FROM pg_tables "
                      "WHERE tablename = 'alembic_version' ORDER BY schemaname"
                  ).fetchall(),
              )
              for schema in ("public", "epok_auth"):
                  relation = connection.execute(
                      "SELECT to_regclass(%s)", (f"{schema}.alembic_version",)
                  ).fetchone()[0]
                  print(f"{schema}.alembic_version relation:", relation)
                  if relation:
                      rows = connection.execute(
                          f'SELECT version_num FROM "{schema}".alembic_version'
                      ).fetchall()
                      print(f"{schema}.alembic_version rows:", rows)
              print(
                  "epok_auth tables:",
                  connection.execute(
                      "SELECT tablename FROM pg_tables WHERE schemaname='epok_auth' "
                      "ORDER BY tablename"
                  ).fetchall(),
              )
          PY
      - name: Reproduce drift check with full traceback
        run: |
          uv run python - <<'PY'
          import os
          from epok_auth.migrate import check_database

          check_database(os.environ["TEST_DATABASE_URL"])
          PY
