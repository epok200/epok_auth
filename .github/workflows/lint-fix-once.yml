name: Apply safe beta lint fixes once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/auth-foundation
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev --python 3.12
      - name: Apply deliberate source fixes
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from pathlib import Path

          service = Path("src/epok_auth/service.py")
          text = service.read_text()
          if "from urllib.parse import urlsplit\n" not in text.split("\n\n", 2)[1]:
              text = text.replace(
                  "from uuid import UUID, uuid4\n",
                  "from urllib.parse import urlsplit\nfrom uuid import UUID, uuid4\n",
                  1,
              )
          text = text.replace("    from urllib.parse import urlsplit\n\n", "")
          if "_EMPTY_CONTEXT = RequestContext()" not in text:
              text = text.replace(
                  '_CAPABILITY = re.compile(r"[a-z0-9][a-z0-9:._-]{0,99}")\n',
                  '_CAPABILITY = re.compile(r"[a-z0-9][a-z0-9:._-]{0,99}")\n'
                  "_EMPTY_CONTEXT = RequestContext()\n",
                  1,
              )
          text = text.replace(
              "context: RequestContext = RequestContext(),",
              "context: RequestContext = _EMPTY_CONTEXT,",
          )
          service.write_text(text)

          passwords = Path("tests/test_passwords.py")
          text = passwords.read_text().replace(
              "    # The implementation may perform one bounded dummy verification, but never hashes the huge input.\n",
              "    # A bounded dummy verification is allowed, but the huge input is never hashed.\n",
          )
          passwords.write_text(text)
          PY
      - name: Apply Ruff safe fixes and canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff check --fix . || true
          uv run ruff format .
      - name: Commit fixes when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No safe lint fixes remain."
            exit 0
          fi
          git config user.name "epok-auth lint bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples pyproject.toml
          git commit -m "refactor: apply safe beta quality fixes"
          git push origin HEAD:codex/auth-foundation
