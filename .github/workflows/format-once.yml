name: Format beta source once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/auth-foundation
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.12.1"
      - run: uv python install 3.12
      - run: uv sync --locked --all-extras --group dev --python 3.12
      - name: Apply canonical Ruff formatting
        run: uv run ruff format src tests examples
      - name: Commit formatting when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Source is already formatted."
            exit 0
          fi
          git config user.name "epok-auth format bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples
          git commit -m "style: apply canonical Ruff formatting"
          git push origin HEAD:codex/auth-foundation
