name: Import clean beta tree v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: epok-auth-clean-beta-import-v2
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted beta branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/auth-foundation
          fetch-depth: 0

      - name: Verify archive and atomically replace the temporary tree
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d .clean-import-v2 ]; then
            echo "Clean beta tree is already installed."
            exit 0
          fi

          test "$(find .clean-import-v2 -maxdepth 1 -name 'chunk*' | wc -l)" -eq 12
          cat .clean-import-v2/chunk* | tr -d '[:space:]' | base64 --decode > /tmp/epok-auth-beta.tar.gz
          echo "b344d3563084dcc6cb8b9972a27b7aa20b45eb1f1a1b52de27a37b85163de11c  /tmp/epok-auth-beta.tar.gz" | sha256sum -c -

          mkdir /tmp/epok-auth-clean
          tar -xzf /tmp/epok-auth-beta.tar.gz -C /tmp/epok-auth-clean
          test -f /tmp/epok-auth-clean/pyproject.toml
          test -f /tmp/epok-auth-clean/src/epok_auth/__init__.py
          test -f /tmp/epok-auth-clean/.github/workflows/ci.yml
          if find /tmp/epok-auth-clean -name .git -print -quit | grep -q .; then
            echo "Archive contains forbidden Git metadata."
            exit 1
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/epok-auth-clean/. .

          git config user.name "epok-auth beta importer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish clean epok-auth beta foundation"
          git push origin HEAD:codex/auth-foundation
