name: Export branch source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'epok200/epok_auth' &&
      github.head_ref == 'codex/auth-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/auth-foundation
          fetch-depth: 1

      - name: Create clean source archive
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=.bootstrap \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            -czf /tmp/epok-auth-source.tar.gz .
          sha256sum /tmp/epok-auth-source.tar.gz > /tmp/epok-auth-source.sha256

      - name: Upload source archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: epok-auth-source
          path: |
            /tmp/epok-auth-source.tar.gz
            /tmp/epok-auth-source.sha256
          if-no-files-found: error
          retention-days: 1
